name: ESP32 firmware

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs cancel superseded runs; main queues them so a web flasher deploy
# always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    defaults:
      run:
        shell: bash
        working-directory: esp32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # test_noise_core links against the host's PSA Crypto library.
      - name: Install host crypto library
        working-directory: .
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libmbedtls-dev pkg-config

      # The discovery and pairing tests compile cJSON from managed_components/,
      # which the component manager fetches on configure.
      - name: Fetch managed components
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -B build-host-tests -DSDKCONFIG=build-host-tests/sdkconfig reconfigure

      - name: Run host tests
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python -m unittest discover -s tests -p 'test_*.py' -v

  simulator:
    name: UI simulator (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            sanitizers: "ON"
          - name: macOS (Apple silicon)
            os: macos-latest
            sanitizers: "OFF"
          - name: macOS (Intel)
            os: macos-15-intel
            sanitizers: "OFF"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure
        run: |
          cmake -S esp32/simulator -B build/simulator -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMUSE_SIM_SANITIZERS=${{ matrix.sanitizers }} \
            -DMUSE_SIM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/simulator --parallel

      - name: Test
        run: ctest --test-dir build/simulator --output-on-failure

  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: muse-s3cam-diy
            target: esp32s3
            overlays: ";devices/sdkconfig.muse;devices/sdkconfig.muse-s3cam-diy" 
    defaults:
      run:
        shell: bash
        working-directory: esp32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The build fails if the app no longer fits its partition.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          DEFAULTS: sdkconfig.defaults${{ matrix.overlays }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -B build -DIDF_TARGET="$TARGET" -DSDKCONFIG=build/sdkconfig \
            -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      # Boards listed in web-flasher/boards.json also go on the web flasher.
      - name: Package for the web flasher
        id: package
        env:
          BOARD: ${{ matrix.board }}
        run: |
          NAME=$(python3 -c 'import json, os; print(next((b["name"] for b in json.load(open("../web-flasher/boards.json")) if b["board"] == os.environ["BOARD"]), ""))')
          [ -n "$NAME" ] || exit 0
          python3 ../web-flasher/make_manifest.py build "out/$BOARD" \
            "Muse Gadget ($NAME)" "$(cat version.txt)+${GITHUB_SHA::7}"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      - if: steps.package.outputs.listed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: esp32/out/
          if-no-files-found: error
          retention-days: 7

  # The web flasher: a page on GitHub Pages that flashes the boards in
  # web-flasher/boards.json from Chrome or Edge over Web Serial (ESP Web Tools).
  # PRs assemble it to check it; pushes to main deploy it.
  web-flasher:
    name: Assemble web flasher
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: site/firmware
          merge-multiple: true

      # A listed board that the build matrix doesn't build has no manifest.
      - name: Add page
        run: |
          for board in $(jq -r '.[].board' web-flasher/boards.json); do
            [ -f "site/firmware/$board/manifest.json" ] || {
              echo "::error::$board is in web-flasher/boards.json but not in the build matrix"
              exit 1
            }
          done
          cp web-flasher/index.html web-flasher/boards.json site/
          echo "{\"commit\": \"$GITHUB_SHA\"}" > site/build.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-web-flasher:
    name: Deploy web flasher
    needs: web-flasher
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
